<mat-toolbar class="mat-toolbar">
    <div class="flex-container">
        <span class="toolbar-title">Controle de Transações</span>
        <button mat-icon-button routerLink="/categorias" title="Ir para Categorias">
            <mat-icon>category</mat-icon>
        </button>
        <button mat-fab class="accent" routerLink="/transacoes/new">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</mat-toolbar>

<mat-form-field appearance="outline" class="flex-container">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Almoço" #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Data Column -->
    <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef> Data </th>
        <td mat-cell *matCellDef="let obj"> {{obj.data | date:'dd/MM/yyyy'}} </td>
    </ng-container>

    <!-- Descricao Column -->
    <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let obj"> {{obj.descricao}} </td>
    </ng-container>

    <!-- Categoria Column -->
    <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef> Categoria </th>
        <td mat-cell *matCellDef="let obj"> {{obj.categoria.nome}} </td>
    </ng-container>

    <!-- Tipo Column -->
    <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let obj"> {{tipoLabel(obj.tipo)}} </td>
    </ng-container>

    <!-- Escopo Column -->
    <ng-container matColumnDef="escopo">
        <th mat-header-cell *matHeaderCellDef> Escopo </th>
        <td mat-cell *matCellDef="let obj"> {{escopoLabel(obj.escopo)}} </td>
    </ng-container>

    <!-- Valor Column -->
    <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef> Valor </th>
        <td mat-cell *matCellDef="let obj" [class.despesa]="obj.tipo === 'DESPESA'" [class.receita]="obj.tipo === 'RECEITA'">
            {{obj.valor | currency:'BRL'}}
        </td>
    </ng-container>

    <!-- Acao Column -->
    <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef> Ação </th>
        <td mat-cell *matCellDef="let obj">
            <button mat-icon-button color="primary" routerLink="/transacoes/edit/{{obj.id}}">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
