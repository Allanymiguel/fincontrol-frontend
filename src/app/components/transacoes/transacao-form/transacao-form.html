<mat-toolbar class="toolbar-title" color="primary">
    Controle de Transações
</mat-toolbar>

<mat-card class="card">
    <mat-card-content>
        <form class="form" [formGroup]="form">
            <div class="grid">
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Descrição</mat-label>
                    <input matInput formControlName="descricao" placeholder="Ex.: Salário mensal" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Valor</mat-label>
                    <input matInput type="number" step="0.01" formControlName="valor" placeholder="Ex.: 1500,00" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Data</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="data" />
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Tipo</mat-label>
                    <mat-select formControlName="idTipo" placeholder="Selecione um tipo">
                        @for (tipo of tipos; track tipo.id) {
                            <mat-option [value]="tipo.id">{{tipo.nome}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Escopo</mat-label>
                    <mat-select formControlName="idEscopo" placeholder="Selecione um escopo">
                        @for (escopo of escopos; track escopo.id) {
                            <mat-option [value]="escopo.id">{{escopo.nome}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Categoria</mat-label>
                    <mat-select formControlName="idCategoria" placeholder="Selecione uma categoria">
                        @for (categoria of categorias; track categoria.id) {
                            <mat-option [value]="categoria.id">{{categoria.nome}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="actions">
                <button mat-raised-button
                    color="warn"
                    (click)="excluir()"
                    [disabled]="!form.value.id">
                    <mat-icon>delete</mat-icon>
                    Excluir
                </button>

                <button mat-raised-button (click)="voltar()">
                    <mat-icon>arrow_back</mat-icon>
                    Cancelar
                </button>

                <button mat-raised-button
                    color="primary"
                    (click)="salvar()"
                    [disabled]="form.invalid">
                    <mat-icon>save</mat-icon>
                    Salvar
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
