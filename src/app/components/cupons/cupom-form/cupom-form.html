<mat-toolbar class="toolbar-title" color="primary">
    Cadastro de Cupons
</mat-toolbar>

<mat-card class="card">
    <mat-card-content>
        <form class="form" [formGroup]="form" (ngSubmit)="salvar()">

            <div class="grid">
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Código</mat-label>
                    <input matInput formControlName="codigo" maxlength="30" placeholder="Ex.: BEMVINDO10"
                        (input)="normalizarCodigo()" />
                    <mat-hint>Letras, números, "-" ou "_"</mat-hint>
                    @if (getErrorMessage('codigo'); as error) {
                        <mat-error>{{ error }}</mat-error>
                    }
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Desconto</mat-label>
                    <input matInput type="number" formControlName="percentualDesconto" min="0.01" max="100" step="0.01" />
                    <span matTextSuffix>%</span>
                    @if (getErrorMessage('percentualDesconto'); as error) {
                        <mat-error>{{ error }}</mat-error>
                    }
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Validade</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="validade" />
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                    <mat-hint>Último dia de uso</mat-hint>
                    @if (getErrorMessage('validade'); as error) {
                        <mat-error>{{ error }}</mat-error>
                    }
                </mat-form-field>
            </div>

            <mat-checkbox formControlName="ativo">Cupom ativo</mat-checkbox>

            <div class="actions">
                <button mat-raised-button color="warn" type="button"
                    (click)="excluir()" [disabled]="!form.value.id">
                    <mat-icon>delete</mat-icon>
                    Excluir
                </button>

                <button mat-raised-button type="button" (click)="voltar()">
                    <mat-icon>arrow_back</mat-icon>
                    Cancelar
                </button>

                <button mat-raised-button color="primary" type="submit">
                    <mat-icon>save</mat-icon>
                    Salvar
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
