<section class="page">
    <form class="sheet" [formGroup]="form">
        <header class="sheet-header">
            <div>
                <span class="label-caps">Classificação</span>
                <h1 class="sheet-title">{{ form.value.id ? 'Editar categoria' : 'Nova categoria' }}</h1>
            </div>
            <button mat-icon-button type="button" (click)="voltar()" aria-label="Fechar">
                <mat-icon>close</mat-icon>
            </button>
        </header>

        <div class="sheet-body">
            <div class="form-grid">
                <mat-form-field appearance="outline">
                    <mat-label>Nome</mat-label>
                    <input matInput formControlName="nome" placeholder="Ex.: Alimentação" />
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Tipo</mat-label>
                    <mat-select formControlName="idTipo" placeholder="Selecione um tipo">
                        @for (tipo of tipos; track tipo.id) {
                            <mat-option [value]="tipo.id">{{tipo.nome}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Cor</mat-label>
                    <input matInput formControlName="cor" maxlength="7" placeholder="Ex.: #4F46E5" />
                </mat-form-field>

                <mat-checkbox formControlName="ativa">Ativa</mat-checkbox>
            </div>
        </div>

        <footer class="sheet-footer">
            <!-- so na edicao: um registro novo ainda nao existe -->
            @if (form.value.id) {
                <button matButton="outlined" type="button" class="botao-perigo acao-perigo"
                    (click)="excluir()">
                    <mat-icon>delete</mat-icon>
                    Excluir
                </button>
            }

            <button matButton="outlined" type="button" (click)="voltar()">
                Cancelar
            </button>

            <button matButton="filled"
                (click)="salvar()"
                [disabled]="form.invalid">
                Salvar
            </button>
        </footer>
    </form>
</section>
