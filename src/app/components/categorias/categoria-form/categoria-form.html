<mat-toolbar class="toolbar-title" color="primary">
    Controle de Categorias
</mat-toolbar>

<mat-card class="card">
    <mat-card-content>
        <form class="form" [formGroup]="form">
            <div class="grid">
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Nome</mat-label>
                    <input matInput formControlName="nome" placeholder="Ex.: Alimentação" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Tipo</mat-label>
                    <mat-select formControlName="idTipo" placeholder="Selecione um tipo">
                        @for (tipo of tipos; track tipo.id) {
                            <mat-option [value]="tipo.id">{{tipo.nome}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Cor</mat-label>
                    <input matInput formControlName="cor" maxlength="7" placeholder="Ex.: #4F46E5" />
                </mat-form-field>

                <mat-checkbox formControlName="ativa">Ativa</mat-checkbox>
            </div>

            <div class="actions">
                <button mat-raised-button
                    color="warn"
                    (click)="excluir()"
                    [disabled]="!form.value.id">
                    <mat-icon>delete</mat-icon>
                    Excluir
                </button>

                <button mat-raised-button (click)="voltar()">
                    <mat-icon>arrow_back</mat-icon>
                    Cancelar
                </button>

                <button mat-raised-button
                    color="primary"
                    (click)="salvar()"
                    [disabled]="form.invalid">
                    <mat-icon>save</mat-icon>
                    Salvar
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
