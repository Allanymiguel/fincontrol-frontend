<mat-toolbar class="toolbar-title" color="primary">
    Controle de Categorias
</mat-toolbar>

<mat-card class="card">
    <mat-card-content>
        <form class="form" [formGroup]="form">
            <div class="grid">

                <!-- Nome -->
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Nome</mat-label>
                    <input matInput formControlName="nome" maxlength="60" placeholder="Ex.: Alimentação" />
                </mat-form-field>

                <!-- Tipo -->
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Tipo</mat-label>
                    <mat-select formControlName="tipo" placeholder="Selecione um tipo">
                        @for (tipo of tipos; track tipo) {
                            <mat-option [value]="tipo">{{tipoLabels[tipo]}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>

                <!-- Cor -->
                <mat-form-field appearance="outline" class="full-width-input">
                    <mat-label>Cor</mat-label>
                    <input matInput formControlName="cor" maxlength="7" placeholder="Ex.: #4F46E5" />
                    <input type="color" matSuffix class="color-picker" [value]="form.value.cor || '#4F46E5'" (input)="onColorPick($event)" />
                </mat-form-field>

                <!-- Ativa -->
                <mat-slide-toggle formControlName="ativa" class="full-width-input">Ativa</mat-slide-toggle>
            </div>

            <div class="actions">
                <button mat-raised-button
                    color="warn"
                    (click)="excluir()"
                    [disabled]="!form.value.id">
                    <mat-icon>delete</mat-icon>
                    Excluir
                </button>

                <button mat-raised-button (click)="voltar()">
                    <mat-icon>arrow_back</mat-icon>
                    Cancelar
                </button>

                <button mat-raised-button
                    color="primary"
                    (click)="salvar()"
                    [disabled]="form.invalid">
                    <mat-icon>save</mat-icon>
                    Salvar
                </button>
            </div>

        </form>
    </mat-card-content>
</mat-card>
