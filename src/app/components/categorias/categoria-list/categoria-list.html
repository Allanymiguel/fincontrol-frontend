<section class="page">
    <header class="page-header">
        <div>
            <h1 class="page-title">Categorias</h1>
            <p class="page-subtitle">{{ totalItems }} {{ totalItems === 1 ? 'categoria' : 'categorias' }}</p>
        </div>
        <button matButton="filled" routerLink="/categorias/new">
            <mat-icon>add</mat-icon>
            Nova categoria
        </button>
    </header>

    <div class="data-card">
        <div class="table-scroll">
            <table mat-table [dataSource]="dataSource">

                <ng-container matColumnDef="numero">
                    <th mat-header-cell *matHeaderCellDef> Nº </th>
                    <td mat-cell *matCellDef="let obj; let i = index"> {{ pageIndex * pageSize + i + 1 }} </td>
                </ng-container>

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef class="col-principal"> Nome </th>
                    <td mat-cell *matCellDef="let obj" class="col-principal"> {{ obj.nome }} </td>
                </ng-container>

                <ng-container matColumnDef="tipo">
                    <th mat-header-cell *matHeaderCellDef> Tipo </th>
                    <td mat-cell *matCellDef="let obj"> <span class="tag" [class.tag-ok]="obj.tipo?.id === 1" [class.tag-erro]="obj.tipo?.id === 2">{{ obj.tipo?.nome }}</span> </td>
                </ng-container>

                <ng-container matColumnDef="cor">
                    <th mat-header-cell *matHeaderCellDef> Cor </th>
                    <td mat-cell *matCellDef="let obj">
                        <span class="cor"><span class="cor-ponto" [style.background-color]="obj.cor"></span>{{ obj.cor }}</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="ativa">
                    <th mat-header-cell *matHeaderCellDef> Ativa </th>
                    <td mat-cell *matCellDef="let obj"> <span class="tag" [class.tag-ok]="obj.ativa">{{ obj.ativa ? 'Ativa' : 'Inativa' }}</span> </td>
                </ng-container>

                <ng-container matColumnDef="acao">
                    <th mat-header-cell *matHeaderCellDef> Ações </th>
                    <td mat-cell *matCellDef="let obj">
                        <button mat-icon-button class="icone-acao" routerLink="/categorias/edit/{{ obj.id }}" aria-label="Editar">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.linha-inativa]="!row.ativa"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell empty" [attr.colspan]="displayedColumns.length">
                        <mat-icon aria-hidden="true">inbox</mat-icon>
                        Nenhuma categoria cadastrada.</td>
                </tr>
            </table>
        </div>

        <mat-paginator
            [length]="totalItems"
            [pageIndex]="pageIndex"
            [pageSize]="pageSize"
            [pageSizeOptions]="[5, 10, 20]"
            (page)="onPageChange($event)">
        </mat-paginator>
    </div>
</section>
