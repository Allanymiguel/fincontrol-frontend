<mat-toolbar class="mat-toolbar">
    <div class="flex-container">
        <span class="toolbar-title">Controle de Categorias</span>
        <button mat-icon-button routerLink="/transacoes" title="Ir para Transações">
            <mat-icon>receipt_long</mat-icon>
        </button>
        <button mat-fab class="accent" routerLink="/categorias/new">
            <mat-icon>add</mat-icon>
        </button>
    </div>
</mat-toolbar>

<mat-form-field appearance="outline" class="flex-container">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Alimentação" #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Numero Column -->
    <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef> Número </th>
        <td mat-cell *matCellDef="let obj; let i = index"> {{i + 1}} </td>
    </ng-container>

    <!-- Nome Column -->
    <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let obj"> {{obj.nome}} </td>
    </ng-container>

    <!-- Tipo Column -->
    <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let obj"> {{tipoLabel(obj.tipo)}} </td>
    </ng-container>

    <!-- Cor Column -->
    <ng-container matColumnDef="cor">
        <th mat-header-cell *matHeaderCellDef> Cor </th>
        <td mat-cell *matCellDef="let obj">
            <span class="cor-swatch" [style.background-color]="obj.cor"></span>
            {{obj.cor}}
        </td>
    </ng-container>

    <!-- Ativa Column -->
    <ng-container matColumnDef="ativa">
        <th mat-header-cell *matHeaderCellDef> Ativa </th>
        <td mat-cell *matCellDef="let obj"> {{obj.ativa ? 'Sim' : 'Não'}} </td>
    </ng-container>

    <!-- Acao Column -->
    <ng-container matColumnDef="acao">
        <th mat-header-cell *matHeaderCellDef> Ação </th>
        <td mat-cell *matCellDef="let obj">
            <button mat-icon-button color="primary" routerLink="/categorias/edit/{{obj.id}}">
                <mat-icon>edit</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
