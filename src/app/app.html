@if (mostrarMenu()) {
    <nav class="app-nav" aria-label="Navegação principal">
        <!-- so para a role USER: sao os dados pessoais de cada usuario (o admin nao os acessa) -->
        @if (auth.temRoleUser()) {
            <div class="nav-section" role="group" aria-labelledby="nav-operacional">
                <span class="nav-label" id="nav-operacional">Operacional</span>
                <a routerLink="/transacoes" routerLinkActive="active">Transações</a>
                <a routerLink="/categorias" routerLinkActive="active">Categorias</a>
                <a routerLink="/contatos" routerLinkActive="active">Contatos</a>
            </div>
        }

        <!-- so para a role ADMIN (o back tambem bloqueia com @RolesAllowed) -->
        @if (auth.isAdmin()) {
            <div class="nav-section nav-admin" role="group" aria-labelledby="nav-admin">
                <span class="nav-label" id="nav-admin">Admin</span>
                <a routerLink="/planos" routerLinkActive="active">Planos</a>
                <a routerLink="/assinaturas" routerLinkActive="active">Assinaturas</a>
                <a routerLink="/cupons" routerLinkActive="active">Cupons</a>
                <a routerLink="/categorias-padrao" routerLinkActive="active">Categorias Padrão</a>
                <a routerLink="/parametros-fiscais" routerLinkActive="active">Parâmetros Fiscais</a>
                <a routerLink="/faixas-irpf" routerLinkActive="active">Faixas IRPF</a>
                <a routerLink="/usuarios" routerLinkActive="active">Usuários</a>
            </div>
        }

        @if (authHabilitada && auth.logado()) {
            <div class="nav-usuario">
                <span class="nav-nome">
                    <mat-icon aria-hidden="true">account_circle</mat-icon>
                    {{ auth.nome() }}
                </span>
                <button mat-stroked-button type="button" (click)="sair()">
                    <mat-icon>logout</mat-icon>
                    Sair
                </button>
            </div>
        }
    </nav>
}

<router-outlet />
